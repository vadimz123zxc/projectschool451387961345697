name: Validate BitTrainer

on:
  push:
    branches:
      - work/ege-2027
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          grep -q 'script.js' index.html
